version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - forbidigo
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - wsl
  settings:
    forbidigo:
      forbid:
        - pattern: ^testEnv\.(Start|Stop)$
          msg: use testutils.StartEnvTest, which registers Stop with DeferCleanup
        - pattern: \.Unix(Nano|Micro|Milli)$
          msg: in tests use testutils.UniqueName
    goconst:
      min-occurrences: 20
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    wsl:
      allow-trailing-comment: true
  exclusions:
    generated: lax
    rules:
      - linters:
          - forbidigo
        path: pkg/testutils/
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
  settings:
    gofmt:
      rewrite-rules:
        - pattern: 'interface{}'
          replacement: 'any'
