# -- Application name string
name: keycloak-operator
# -- Number of operator replicas.
replicaCount: 1
# -- Annotations to be added to the Deployment
annotations: {}
# -- Cluster domain for constructing service DNS names
clusterDomain: cluster.local
# -- Labels to be added to the pod
podLabels: {}
# -- Node labels for pod assignment
nodeSelector: {}
# -- Node tolerations for server scheduling to nodes with taints
tolerations: []
# -- Affinity for pod assignment
affinity: {}
image:
  # -- KubeRocketCI keycloak-operator Docker image registry.
  registry: ""
  # -- KubeRocketCI keycloak-operator Docker image name. The released image can be found on [Dockerhub](https://hub.docker.com/r/epamedp/keycloak-operator)
  repository: epamedp/keycloak-operator
  # if not defined then .Chart.AppVersion is used
  # -- KubeRocketCI keycloak-operator Docker image tag. The released image can be found on [Dockerhub](https://hub.docker.com/r/epamedp/keycloak-operator/tags)
  tag:
# -- If defined, a imagePullPolicy applied to the deployment
imagePullPolicy: "IfNotPresent"
# -- If defined, imagePullSecrets are applied to deployment
imagePullSecrets: []

# -- Resource limits and requests for the pod
resources:
  limits:
    memory: 192Mi
  requests:
    cpu: 50m
    memory: 64Mi

# -- Deployment Security Context
# Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
securityContext:
  runAsNonRoot: true

# -- Container Security Context
# Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
containerSecurityContext:
  allowPrivilegeEscalation: false

# -- Additional volumes to be added to the pod
extraVolumes: []
#  - name: custom-ca
#    secret:
#      defaultMode: 420
#      secretName: custom-ca

# -- Additional volumeMounts to be added to the container
extraVolumeMounts: []
#  - name: custom-ca
#    mountPath: /etc/ssl/certs/CA.crt
#    readOnly: true
#    subPath: CA.crt

# -- If clusterReconciliationEnabled is true, the operator reconciles all Keycloak instances in the cluster;
#  otherwise, it only reconciles instances in the same namespace by default, and cluster-scoped resources are ignored.
clusterReconciliationEnabled: false

# -- If set to true, the operator will set the owner reference for all resources that have Keycloak or KeycloakRealm as reference.
# This is legacy behavior and not recommended for use. In the future, this will be set to false by default.
enableOwnerRef: true

# -- Hostnames the operator and Keycloak may reach with credentials resolved from Secrets.
# Covers Keycloak spec.url and spec.tlsServerName, realm spec.smtp.connection.host, and the known
# destination keys (tokenUrl, connectionUrl, ...) inside identity provider, realm component and
# authentication flow authenticator config.
# Values in other config keys, including the keys of custom providers, are not checked.
# The operator resolves $secretName:secretKey references with its own ServiceAccount, so whoever
# writes a KeycloakRealmIdentityProvider, KeycloakRealmComponent or KeycloakAuthFlow can send any
# Secret of its namespace to an address that resource names. Grant create and update on these kinds
# only to principals that may read Secrets in that namespace; when a GitOps tool applies them, its
# repository committers are the authors. See docs/security.md.
# Exact, case-insensitive match; no wildcards.
# Write the hostname only, without scheme, port or path, and prefer fully qualified names.
# An empty list means no policy: every destination is allowed and nothing is logged or counted.
# Add at least one host (for example the Keycloak host) to turn on reporting.
allowedDestinationHosts: []

# -- If true, a destination absent from allowedDestinationHosts fails the reconcile.
# If false, destinations absent from a non-empty list are logged and counted, so the list
# can be built from a running cluster before enforcement is turned on.
# Enabling this with an empty allowedDestinationHosts stops the operator at startup.
enforceDestinationAllowlist: false

# -- Interval for periodic reconciliation after a successful reconcile,
# as a Go duration with a unit (for example "10m"); a bare number is rejected.
# Applies to KeycloakRealm, KeycloakClient, KeycloakRealmGroup, KeycloakRealmRole and KeycloakRealmRoleBatch.
# Empty disables periodic reconciliation for these resources: they reconcile only on CR changes,
# operator restart, or the cache resync (~10h). Keycloak and KeycloakRealmUser have no periodic
# reconciliation. Other resources use fixed intervals and are not affected.
successReconcileTimeout: ""

# -- If set to true, enables webhook resources (ValidatingWebhookConfiguration, Service, and Certificate).
# Webhooks require cert-manager to be installed in the cluster.
enableWebhooks: true

# -- ServiceAccount configuration
serviceAccount:
  # -- If true, a ServiceAccount will be created
  create: true
  # -- The name of the ServiceAccount to use. Defaults to "edp-keycloak-operator"
  name: "edp-keycloak-operator"
  # -- Annotations to add to the ServiceAccount (e.g. for AWS IAM role association)
  annotations: {}
  # -- Additional labels to add to the ServiceAccount
  labels: {}
