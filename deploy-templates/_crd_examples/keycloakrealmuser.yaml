apiVersion: v1.edp.epam.com/v1
kind: KeycloakRealmUser
metadata:
  name: keycloakrealmuser-sample
spec:
  realmRef:
    name: keycloakrealm-sample
    kind: KeycloakRealm
  username: "john.snow13"
  firstName: "John"
  lastName: "Snow"
  email: "john.snow13@example.com"
  enabled: true
  emailVerified: true
  keepResource: true
  passwordSecret:
    key: password
    name: keycloakrealmuser-sample-password
    temporary: true
  requiredUserActions:
    - UPDATE_PROFILE
  # roles and clientRoles have three states.
  #   omitted    the operator does not manage them; Keycloak keeps what it has,
  #              including the default-roles-<realm> mapping it assigns at creation
  #   []         the operator manages them and removes every mapping
  #   [a, b]     the operator manages them; the user ends up with exactly a and b
  # Helm: write [] in values.yaml or pass --set-json 'roles=[]'. `--set roles={}`
  # yields [""], and a {{ if .Values.roles }} guard drops [] entirely.
  roles:
    - offline_access
  clientRoles:
    - clientId: account
      roles:
        - view-profile
    # No roles key: this client's mappings are left untouched.
    - clientId: broker
  groups:
    - developers
    - /parent/child
  attributesV2:
    department: ["IT"]
    location: ["Winterfell"]

---
apiVersion: v1
kind: Secret
metadata:
  name: keycloakrealmuser-sample-password
type: Opaque
data:
  password: "U29tZVBhc3N3b3JkMTIzIQ==" # SomePassword123!