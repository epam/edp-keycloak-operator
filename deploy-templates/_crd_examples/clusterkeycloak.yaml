apiVersion: v1.edp.epam.com/v1alpha1
kind: ClusterKeycloak
metadata:
  name: keycloak-sample
spec:
  secret: keycloak-access
  url: https://keycloak.example.com

---
# Password grant authentication
apiVersion: v1.edp.epam.com/v1alpha1
kind: ClusterKeycloak
metadata:
  name: clusterkeycloak-password-grant
spec:
  url: https://keycloak.example.com
  auth:
    passwordGrant:
      username:
        value: admin
      passwordRef:
        name: keycloak-access
        key: password

---
# Client credentials authentication
apiVersion: v1.edp.epam.com/v1alpha1
kind: ClusterKeycloak
metadata:
  name: clusterkeycloak-client-creds
spec:
  url: https://keycloak.example.com
  auth:
    clientCredentials:
      clientId:
        value: my-admin-client
      clientSecretRef:
        name: keycloak-client-secret
        key: client-secret

---
# In-cluster Service URL; the certificate is issued for the public hostname
apiVersion: v1.edp.epam.com/v1alpha1
kind: ClusterKeycloak
metadata:
  name: clusterkeycloak-in-cluster
spec:
  url: https://keycloak-service.keycloak.svc.cluster.local:8443
  tlsServerName: keycloak.example.com
  auth:
    passwordGrant:
      username:
        value: admin
      passwordRef:
        name: keycloak-access
        key: password
