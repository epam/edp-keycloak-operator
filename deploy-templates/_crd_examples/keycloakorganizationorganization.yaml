# Organization with identity provider configuration
apiVersion: v1.edp.epam.com/v1alpha1
kind: KeycloakOrganization
metadata:
  name: test-keycloak-organization
  namespace: default
spec:
  name: "Test Organization"
  alias: "test-org"
  domainsV2:
    - name: "example.com"
      verified: true
      # Keycloak 26.8 or later; must name an entry of identityProviders:
      # identityProviderAlias: "test-org-idp"
      # autoRedirect: true
    - name: "test.com"
  redirectUrl: "https://example.com/redirect"
  description: "Test organization"
  attributes:
    department:
      - "engineering"
      - "qa"
    location:
      - "us-east"
  # identityProviders has three states.
  #   omitted    the operator does not manage the links; Keycloak keeps what it has
  #   []         the operator manages the links and unlinks every identity provider
  #   [a, b]     the operator manages the links; the organization ends up with exactly a and b
  # Helm: write [] in values.yaml or pass --set-json 'identityProviders=[]'.
  identityProviders:
    - alias: "test-org-idp"
      # Keycloak 26.8 or later:
      # autoMembership: false
      # membershipType: UNMANAGED
  realmRef:
    kind: KeycloakRealm
    name: test-org-realm

---

apiVersion: v1.edp.epam.com/v1
kind: KeycloakRealmIdentityProvider
metadata:
  name: test-org-idp
  namespace: default
spec:
  alias: "test-org-idp"
  enabled: true
  providerId: "github"
  realmRef:
    kind: KeycloakRealm
    name: test-org-realm
  config:
    clientId: "test-org-client-id"
    clientSecret: "test-org-client-secret"
    kc.org.domain: "example.com"
    kc.org.broker.redirect.mode.email-matches: "true"