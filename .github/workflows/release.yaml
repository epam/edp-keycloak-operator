name: Create KRCI release
on:
  push:
    tags:
      - 'v*'

env:
  GOLANG_VERSION: '1.27'

jobs:
  prepare-release:
    name: Perform automatic release on trigger ${{ github.ref }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The name of the tag as supplied by the GitHub event
      SOURCE_TAG: ${{ github.ref }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          check-latest: true

      - name: Check if the published tag is well formed and setup vars
        run: |
          set -xueo pipefail

          # Registry and Rekor can lag behind the tag push: retry each lookup.
          # RETRY_ATTEMPTS tries, waiting RETRY_DELAY * attempt seconds between them.
          RETRY_ATTEMPTS="${RETRY_ATTEMPTS:-5}"
          RETRY_DELAY="${RETRY_DELAY:-15}"

          # retry <command...>: run the command until it succeeds, at most RETRY_ATTEMPTS
          # times. Stdout is passed through, log lines go to stderr.
          retry() {
            attempt=1
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "${attempt}" -ge "${RETRY_ATTEMPTS}" ]; then
                echo "::error::'$*' failed after ${attempt} attempts" >&2
                return 1
              fi
              delay=$(( RETRY_DELAY * attempt ))
              echo "'$*' failed (attempt ${attempt}/${RETRY_ATTEMPTS}), retrying in ${delay}s" >&2
              sleep "${delay}"
              attempt=$(( attempt + 1 ))
            done
          }

          # Print the digest of the first layer of an image manifest. Fails if it is missing.
          layer_digest() {
            d=$(crane manifest "$1" | jq -r '.layers[0].digest // empty')
            [ -n "${d}" ] || return 1
            echo "${d}"
          }

          # Print the Rekor entry UUID for a layer digest. Fails if there is none yet.
          rekor_uuid() {
            u=$(rekor-cli search --sha "$1" --format json | jq -r '.UUIDs[0] // empty')
            [ -n "${u}" ] || return 1
            echo "${u}"
          }

          # refs/tags/v2.10.7 -> v2.10.7
          RELEASE_TAG="${SOURCE_TAG##*/}"
          # install git-chglog (same version as the Makefile)
          retry go install github.com/git-chglog/git-chglog/cmd/git-chglog@v0.15.4
          # install crane
          retry go install github.com/google/go-containerregistry/cmd/crane@v0.16.1
          # install rekor-cli
          retry go install github.com/sigstore/rekor/cmd/rekor-cli@v1.3.3

          git-chglog --template .chglog/release.tpl.md -o release.md ${RELEASE_TAG}

          # Extract image name and tag from RELEASE_TAG
          IMAGE_NAME="epamedp/keycloak-operator"
          IMAGE_TAG=${RELEASE_TAG#v}

          # Get the digest of the image
          DIGEST=$(retry crane digest ${IMAGE_NAME}:${IMAGE_TAG} | tr ':' '-')

          # Get the digest of the attestation layer
          ATTESTATION_DIGEST=$(retry layer_digest ${IMAGE_NAME}:${DIGEST}.att)

          # Get the digest of the signature layer
          SIGNATURE_DIGEST=$(retry layer_digest ${IMAGE_NAME}:${DIGEST}.sig)

          # Get the Rekor UUIDs of the attestation and the signature
          ATTESTATION_UUID=$(retry rekor_uuid ${ATTESTATION_DIGEST})
          SIGNATURE_UUID=$(retry rekor_uuid ${SIGNATURE_DIGEST})

          # Create a new file with the desired text and the UUIDs
          echo "### Deployment Certifications and Source Traceability" > new_release.md
          echo "KubeRocketCI container images bear [cosign](https://github.com/sigstore/cosign) signatures. Refer to the [documentation](https://docs.kuberocketci.io/docs/developer-guide/artifacts-verification) for instructions on verification." >> new_release.md
          echo "The Rekor UUID's for this release is \`${ATTESTATION_UUID}\` - attestation and" >> new_release.md
          echo "\`${SIGNATURE_UUID}\` - signature" >> new_release.md

          # Append the contents of release.md to new_release.md
          cat release.md >> new_release.md

          # Move new_release.md to release.md
          mv new_release.md release.md

          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: create_release
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release.md
